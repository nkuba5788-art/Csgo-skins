<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaseFlip CS2</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #101621;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #263143;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #60a5fa;
}

.balance {
    background: #182131;
    padding: 10px 15px;
    border-radius: 12px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 8px;
    padding: 12px;
    overflow-x: auto;
}

nav button {
    border: 0;
    padding: 11px 16px;
    border-radius: 10px;
    background: #1b2433;
    color: white;
    font-weight: bold;
}

nav button.active {
    background: #2563eb;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.cases {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
}

.card {
    background: #111824;
    border: 1px solid #263143;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
}

.case-icon {
    font-size: 65px;
    margin: 10px;
}

.price {
    color: #60a5fa;
    font-weight: bold;
    margin: 8px;
}

button.action {
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
}

button.action:active {
    transform: scale(.96);
}

.roulette {
    height: 110px;
    margin-top: 25px;
    background: #0d131e;
    border: 2px solid #263143;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
}

.pointer {
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    width: 3px;
    background: #facc15;
    z-index: 5;
}

.track {
    display: flex;
    gap: 8px;
    position: absolute;
    top: 15px;
    left: 0;
}

.skin {
    min-width: 105px;
    height: 78px;
    border-radius: 10px;
    background: #202a3a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
}

.blue {
    border-bottom: 4px solid #3b82f6;
}

.purple {
    border-bottom: 4px solid #a855f7;
}

.pink {
    border-bottom: 4px solid #ec4899;
}

.red {
    border-bottom: 4px solid #ef4444;
}

.gold {
    border-bottom: 4px solid #facc15;
}

.result {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 18px;
    min-height: 28px;
}

.coin {
    width: 120px;
    height: 120px;
    margin: 25px auto;
    border-radius: 50%;
    background: linear-gradient(145deg, #fde047, #ca8a04);
    border: 6px solid #fef08a;
    color: #422006;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: bold;
}

.spin {
    animation: spin 1.1s ease-in-out;
}

@keyframes spin {
    from {
        transform: rotateY(0deg);
    }
    to {
        transform: rotateY(1080deg);
    }
}

input {
    width: 100%;
    max-width: 300px;
    padding: 12px;
    background: #0d131e;
    border: 1px solid #334155;
    color: white;
    border-radius: 10px;
    margin: 8px;
}

.inventory {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
}

.info {
    color: #94a3b8;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ CaseFlip</div>
    <div class="balance">💰 <span id="balance">5000</span></div>
</header>

<nav>
    <button class="active" onclick="page('cases', this)">📦 Skrzynki</button>
    <button onclick="page('flip', this)">🪙 Coin Flip</button>
    <button onclick="page('inventory', this)">🎒 Ekwipunek</button>
</nav>

<div class="container">

<!-- SKRZYNKI -->

<section id="cases" class="page active">

<h2>📦 Skrzynki</h2>

<div class="cases">

<div class="card">
<div class="case-icon">📦</div>
<h3>Starter Case</h3>
<div class="price">100 💰</div>
<button class="action" onclick="openCase(0)">OTWÓRZ</button>
</div>

<div class="card">
<div class="case-icon">🎁</div>
<h3>Pro Case</h3>
<div class="price">500 💰</div>
<button class="action" onclick="openCase(1)">OTWÓRZ</button>
</div>

<div class="card">
<div class="case-icon">💎</div>
<h3>MEGA Case</h3>
<div class="price">1000 💰</div>
<button class="action" onclick="openCase(2)">OTWÓRZ</button>
</div>

</div>

<div class="roulette">
<div class="pointer"></div>
<div id="track" class="track"></div>
</div>

<div id="caseResult" class="result"></div>

</section>


<!-- COIN FLIP -->

<section id="flip" class="page">

<div class="card">

<h2>🪙 Coin Flip 50/50</h2>

<p class="info">
Zakłady działają wyłącznie na wirtualne monety.
</p>

<div id="coin" class="coin">?</div>

<input id="bet" type="number" value="100" min="1">

<br>

<button class="action" onclick="flip('ORZEŁ')">
ORZEŁ
</button>

<button class="action" onclick="flip('RESZKA')">
RESZKA
</button>

<div id="flipResult" class="result"></div>

</div>

</section>


<!-- EKWIPUNEK -->

<section id="inventory" class="page">

<h2>🎒 Ekwipunek</h2>

<div id="inventoryList" class="inventory">
</div>

</section>

</div>


<script>

let balance = 5000;

function updateBalance() {
    document.getElementById("balance").textContent =
        balance.toLocaleString("pl-PL");
}


function randomItem(caseData) {

    const random =
        Math.floor(Math.random() * caseData.items.length);

    return caseData.items[random];
}
